.postlist .summary{color:var(--muted);margin:0;font-size:14.5px}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);
border-radius:4px;padding:1px 8px;font-size:12px;margin-right:6px}
article.paper{background:var(--card);border:1px solid var(--line);
border-radius:10px;padding:34px 38px}
article.paper h1{margin:0 0 10px;font-size:27px;line-height:1.4}
article.paper .meta{color:var(--muted);font-size:13.5px;
border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px}
article.paper h2{font-size:21px;margin:32px 0 12px;padding-left:11px;
border-left:4px solid var(--accent)}
article.paper h3{font-size:18px;margin:24px 0 10px}
article.paper p{margin:0 0 16px}
article.paper ul,article.paper ol{padding-left:24px;margin:0 0 18px}
article.paper li{margin-bottom:6px}
article.paper img{max-width:100%;height:auto;border:1px solid var(--line);

article.paper figure{margin:18px 0;text-align:center}
article.paper pre{background:#f4f6f8;border:1px solid var(--line);border-radius:7px;
padding:16px;overflow-x:auto;line-height:1.6;font-size:13.5px}
article.paper code{background:#f0f2f5;border-radius:3px;padding:1px 5px;
font-family:Consolas,"Courier New",monospace;font-size:.92em}
article.paper pre code{background:none;padding:0}
article.paper blockquote{margin:0 0 18px;padding:10px 18px;background:var(--accent-soft);
border-left:4px solid var(--accent);color:#33526a;border-radius:0 6px 6px 0}
.table-wrap{overflow-x:auto;margin:0 0 18px}
article.paper table{border-collapse:collapse;width:100%;font-size:14.5px}
article.paper th,article.paper td{border:1px solid var(--line);padding:9px 12px;text-align:left}
article.paper th{background:#f2f5f8;font-weight:600}
.todo{background:var(--todo-bg);color:var(--todo-ink);border-radius:3px;

.back{display:inline-block;margin-top:26px;font-size:14px}
footer.site{border-top:1px solid var(--line);background:var(--card);
color:var(--muted);font-size:13px;padding:22px 0;text-align:center}
footer.site p{margin:4px 0}
@media(max-width:600px){.wrap{padding:0 14px}article.paper{padding:22px 18px}
